name: Plugin-ci

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Publish ASFFreeGames (net10.0)
        run: dotnet publish ASFFreeGames -c Release -p:TargetFramework=net10.0 -p:TreatWarningsAsErrors=false -p:CodeAnalysisTreatWarningsAsErrors=false -p:WarningsAsErrors="" -o publish_out

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: ASFFreeGames-DLL-net10
          path: publish_out/
