name: Plugin-ci

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Build ASFFreeGames
        run: dotnet build ASFFreeGames -c Release

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: ASFFreeGames-DLL
          path: ASFFreeGames/bin/Release/
